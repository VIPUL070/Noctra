name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Dummy values to satisfy build-time validations (Zod, Prisma, Auth)
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      SKIP_ENV_VALIDATION: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Generates types so TypeScript & Next.js build don't complain
      - run: npx prisma generate

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build